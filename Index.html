<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotCloud - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0b0e14; }</style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-200 font-sans">

    <div class="w-full max-w-md p-8 bg-[#151922] rounded-xl shadow-2xl border border-gray-800">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500 tracking-wider">
                BOT<span class="text-white">CLOUD</span>
            </h1>
            <p class="text-xs text-gray-400 mt-2">Conecte sua conta IQ Option na nuvem</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">E-mail IQ Option</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-[#1e2530] border border-gray-700 rounded-lg focus:outline-none focus:border-green-500 text-white placeholder-gray-500 transition-colors" placeholder="seu_email@exemplo.com">
            </div>

            <div>
                <label for="senha" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Senha</label>
                <input type="password" id="senha" required class="w-full px-4 py-3 bg-[#1e2530] border border-gray-700 rounded-lg focus:outline-none focus:border-green-500 text-white placeholder-gray-500 transition-colors" placeholder="••••••••">
            </div>

            <div>
                <label for="ambiente" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Tipo de Conta</label>
                <select id="ambiente" class="w-full px-4 py-3 bg-[#1e2530] border border-gray-700 rounded-lg focus:outline-none focus:border-green-500 text-white cursor-pointer">
                    <option value="PRACTICE">Conta Demonstração (Treinamento)</option>
                    <option value="REAL">Conta Real (Risco Alto)</option>
                </select>
            </div>

            <div id="statusMessage" class="hidden text-sm text-center p-3 rounded-lg font-medium"></div>

            <button type="submit" id="btnConectar" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-lg shadow-lg transition-all active:scale-[0.98]">
                CONECTAR NA NUVEM
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const ambiente = document.getElementById('ambiente').value;
            const btn = document.getElementById('btnConectar');
            const status = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerText = "CONECTANDO NA NUVEM...";
            status.className = "text-sm text-center p-3 rounded-lg font-medium bg-blue-950 text-blue-400 block";
            status.innerText = "Estabelecendo túnel seguro com a IQ Option...";

            try {
                const resposta = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha, ambiente })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    status.className = "text-sm text-center p-3 rounded-lg font-medium bg-green-950 text-green-400 block";
                    status.innerText = "Conectado! Redirecionando...";
                    
                    localStorage.setItem('saldo', resultado.saldo_inicial);
                    localStorage.setItem('ambiente', ambiente === 'PRACTICE' ? 'DEMO' : 'REAL');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(resultado.detail || "Erro desconhecido");
                }
            } catch (erro) {
                status.className = "text-sm text-center p-3 rounded-lg font-medium bg-red-950 text-red-400 block";
                status.innerText = erro.message;
                btn.disabled = false;
                btn.innerText = "TENTAR NOVAMENTE";
            }
        });
    </script>
</body>
</html>
